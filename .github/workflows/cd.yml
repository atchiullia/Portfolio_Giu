name: CD - Deploy to Raspberry Pi

on:
  workflow_run:
    workflows: ["CI - Code Check & Security Scan"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-portfolio
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: [self-hosted, linux, ARM64, portfolio-pi]

    steps:
      - name: Checkout the tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Sync site to the Pi
        run: |
          rsync -rlt --delete \
            --chmod=D755,F644 \
            --exclude '.DS_Store' \
            portfolio/ /mnt/ssd/portfolio/site/

      - name: Smoke check
        run: test -s /mnt/ssd/portfolio/site/index.html && test -s /mnt/ssd/portfolio/site/404.html
