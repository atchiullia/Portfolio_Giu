name: CD - Deploy to Raspberry Pi

on:
  workflow_run:
    workflows: ["CI - Code Check & Security Scan"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-portfolio
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: [self-hosted, linux, ARM64, portfolio-pi]

    steps:
      - name: Checkout the tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Sync site to the Pi
        run: |
          : "${PORTFOLIO_SITE_DIR:?PORTFOLIO_SITE_DIR not set on the runner}"
          rsync -rlt --safe-links --delete \
            --chmod=D755,F644 \
            --exclude '.DS_Store' \
            portfolio/ "$PORTFOLIO_SITE_DIR"/

      - name: Smoke check
        run: test -s "$PORTFOLIO_SITE_DIR/index.html" && test -s "$PORTFOLIO_SITE_DIR/404.html"
