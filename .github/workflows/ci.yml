name: CI - Code Check & Security Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: table
          output: 'trivy-portfolio-results.txt'
          severity: 'UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL'

      - name: Trivy Summary
        if: always()
        run: |
          {
            echo "### Vulnerability Report"
            echo "<details><summary>Expand</summary>"
            echo
            if [[ -s trivy-portfolio-results.txt ]]; then
              cat trivy-portfolio-results.txt
            else
              echo "No vulnerabilities found or the report is empty"
            fi
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
