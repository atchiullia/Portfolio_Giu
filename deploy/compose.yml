name: portfolio

services:
  web:
    image: nginx:1.30.5-alpine
    container_name: portfolio-web
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    volumes:
      - /mnt/ssd/portfolio/site:/usr/share/nginx/html:ro
      - /mnt/ssd/portfolio/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [web]

  cloudflared:
    image: cloudflare/cloudflared:2026.9.3
    container_name: portfolio-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on: [web]
    networks: [web]

networks:
  web:
